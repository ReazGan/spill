name: spill
description: Find API keys and secrets left in a site's client-side code.
branding:
  icon: eye-off
  color: gray-dark
inputs:
  url:
    description: URL to scan (you must own it or be authorised).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - shell: bash
      run: go run github.com/ReazGan/spill@latest "${{ inputs.url }}"
